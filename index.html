<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Тест отправки</title></head>
<body style="font-family: sans-serif; padding: 2rem;">
  <h2>Тестовая отправка данных</h2>
  <button id="btn" style="padding: 1rem 2rem; font-size: 1.1rem; cursor: pointer;">
    Отправить тестовые данные
  </button>
  <p id="status" style="margin-top: 1rem; color: #555;"></p>

  <script>
    // Ваш URL развертывания
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwjaxELNQQnWHwiIH1fUBWBkSLrkqYiv2josdTnRuxv4r6icsXatq8dd7-I0XgoBVyF/exec';

    document.getElementById('btn').addEventListener('click', async () => {
      const status = document.getElementById('status');
      status.textContent = 'Отправка...';

      // Формируем минимальный тестовый payload (структура как в основном опроснике)
      const testPayload = {
        ageGroup: '10-13',
        fio: 'ТЕСТ ТЕСТ ТЕСТ',
        className: '5 класс',
        age: '10',
        timestamp: new Date().toISOString(),
        answers: { z1: 1, z2: 2 }, // минимум, чтобы не упало
        results: { zung: { sum: 3, index: 4, level: 'lvl-low', label: 'Тест' } },
        suspicious: []
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors', // Важно для GAS
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(testPayload)
        });

        // В режиме no-cors мы не можем прочитать ответ, но если ошибки сети нет — считаем успехом
        status.textContent = '✅ Отправлено! Проверьте таблицу и журнал выполнения GAS.';
        status.style.color = 'green';
      } catch (err) {
        status.textContent = '❌ Ошибка сети: ' + err.message;
        status.style.color = 'red';
      }
    });
  </script>
</body>
</html>
